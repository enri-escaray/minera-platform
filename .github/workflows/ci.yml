name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: python tools/validar_contratos.py

  # Borde de autenticación: los tests que fallan acá son puertas abiertas, no
  # tests rotos. Corre antes que el resto para que el fallo sea inequívoco.
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e libs/comun pytest httpx fastapi
      - run: cd libs/comun && python -m pytest -q

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [trazabilidad, ingesta, mantenimiento, despacho, reportes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e libs/comun
      - run: pip install -r services/${{ matrix.servicio }}/requirements.txt
      - run: cd services/${{ matrix.servicio }} && python -m pytest -q

  # Vulnerabilidades conocidas en dependencias. Informativo por ahora: que un CVE
  # publicado hoy no frene un despliegue de mina, pero que nadie pueda decir que
  # no se sabía.
  dependencias:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: |
          for s in trazabilidad ingesta mantenimiento despacho reportes; do
            echo "== $s"; pip-audit -r services/$s/requirements.txt || true
          done

  migraciones:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env: { POSTGRES_USER: minera, POSTGRES_PASSWORD: ci, POSTGRES_DB: sitio }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minera -d sitio" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: aplicar migraciones en orden
        run: |
          for m in db/migrations/*.sql; do
            PGPASSWORD=ci psql -h localhost -U minera -d sitio -v ON_ERROR_STOP=1 -f "$m"
          done
