# En prod estos valores llegan por sealed-secrets o external-secrets, NUNCA en git.
# Este archivo es la plantilla de referencia (ver CLAUDE.md, regla 7).
#
# AUTH_SECRET solo aplica a AUTH_MODE=dev y NO debe existir en producción: en
# modo oidc la firma se valida contra el JWKS del IdP y un secreto HS256 suelto
# es una vía de emisión de tokens que nadie está mirando.
apiVersion: v1
kind: Secret
metadata: { name: minera-secretos, namespace: minera-sitio }
type: Opaque
stringData:
  DATABASE_URL: "postgresql://minera:CAMBIAR@db:5432/sitio"
  OIDC_JWKS_URL: "https://keycloak.interno/realms/minera/protocol/openid-connect/certs"
  # Credencial propia del servicio `reportes` para consultar /pesajes en
  # trazabilidad (client credentials del IdP). Rotar según política del IdP.
  SERVICIO_TOKEN: "CAMBIAR"
