# Los cuatro servicios de dominio del sitio. Réplicas: 2 para APIs sin estado
# (trazabilidad, despacho, mantenimiento) con anti-affinity suave; ingesta es 1
# (posee la cola SQLite en PVC — escritor único por diseño del store-and-forward).
#
# Endurecimiento común (ver también deploy/k3s/README.md):
# - runAsNonRoot + uid 10001: el mismo usuario que crean los Dockerfiles.
# - readOnlyRootFilesystem: el código no se modifica en runtime; lo escribible
#   son los PVC declarados y un /tmp efímero.
# - drop ALL capabilities: ningún servicio necesita privilegios de red ni de FS.
# - resources: sin límites, un servicio con fuga de memoria se lleva el nodo, y
#   el nodo se lleva el turno (la mina no puede parar).
apiVersion: apps/v1
kind: Deployment
metadata: { name: trazabilidad, namespace: minera-sitio }
spec:
  replicas: 2
  selector: { matchLabels: { app: trazabilidad } }
  template:
    metadata: { labels: { app: trazabilidad } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: trazabilidad } }
      containers:
        - name: app
          image: registry.interno/minera/trazabilidad:0.1.0
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: minera-secretos } }]
          env:
            - { name: SITIO_ID, value: sitio-01 }
            - { name: AUTH_MODE, value: oidc }
            # AUTH_MODE=oidc exige audiencia y emisor: sin ellos un token emitido
            # para otra aplicación del mismo realm sería aceptado acá.
            - { name: OIDC_AUDIENCE, value: minera-sitio }
            - { name: OIDC_ISSUER, value: "https://keycloak.interno/realms/minera" }
            # Consultas cerradas en producción: la cadena de custodia es dato
            # regulatorio (regla 7: denegación por defecto).
            - { name: AUTH_LECTURA, value: exigir }
            - { name: OUTBOX_DIR, value: /var/outbox }
            - { name: AUDIT_DIR, value: /var/auditoria }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: outbox, mountPath: /var/outbox }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 15 }
      volumes:
        - name: outbox
          persistentVolumeClaim: { claimName: outbox-compartida }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: trazabilidad, namespace: minera-sitio }
spec: { selector: { app: trazabilidad }, ports: [{ port: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingesta, namespace: minera-sitio }
spec:
  replicas: 1          # escritor único de la cola persistente
  strategy: { type: Recreate }
  selector: { matchLabels: { app: ingesta } }
  template:
    metadata: { labels: { app: ingesta } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: registry.interno/minera/ingesta:0.1.0
          ports: [{ containerPort: 8001 }]
          env:
            - { name: SITIO_ID, value: sitio-01 }
            - { name: COLA_PATH, value: /var/cola/eventos.db }
            - { name: OUTBOX_DIR, value: /var/outbox }
            - { name: MQTT_HOST, value: mqtt }
            - { name: KAFKA_BOOTSTRAP, value: "redpanda:9092" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: cola, mountPath: /var/cola }
            - { name: outbox, mountPath: /var/outbox }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /health, port: 8001 }, periodSeconds: 5 }
      volumes:
        - name: cola
          persistentVolumeClaim: { claimName: cola-ingesta }
        - name: outbox
          persistentVolumeClaim: { claimName: outbox-compartida }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: ingesta, namespace: minera-sitio }
spec: { selector: { app: ingesta }, ports: [{ port: 8001 }] }
---
