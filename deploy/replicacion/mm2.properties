# MirrorMaker 2 — corre en la DMZ industrial
clusters = sitio, nube
sitio.bootstrap.servers = redpanda.minera-sitio.svc:9092
nube.bootstrap.servers = kafka-nube.interno:9092

# Unidireccional: solo sitio -> nube
sitio->nube.enabled = true
nube->sitio.enabled = false

sitio->nube.topics = trazabilidad\.lotes|trazabilidad\.pesajes|mantenimiento\.ots|despacho\.asignaciones|telemetria\.equipos
replication.factor = 3
sync.topic.acls.enabled = false
emit.checkpoints.enabled = true

# TLS mutuo en ambos extremos (certificados emitidos por la CA interna)
sitio.security.protocol = SSL
nube.security.protocol = SSL
