[project]
name = "minera-comun"
version = "0.1.0"
description = "Utilidades transversales del sitio: outbox de eventos, seguridad RBAC, auditoría"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "PyJWT>=2.8", "fastapi>=0.115"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minera_comun*"]
